<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quaestor – ledenbetalingen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#8b1e3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quaestor">
<style>
:root{--bg:#eef0f3;--card:#fff;--tx:#16181d;--mu:#646a76;--bd:#d9dde3;--ac:#8b1e3f;--on:#fff;--ok:#1b7a4b;--er:#b3261e;--in:#f6f7f9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1a1d23;--tx:#eceef2;--mu:#9aa1ad;--bd:#2d323b;--ok:#5cc896;--er:#f28b82;--in:#12151a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--card:#1a1d23;--tx:#eceef2;--mu:#9aa1ad;--bd:#2d323b;--ok:#5cc896;--er:#f28b82;--in:#12151a;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--ac);color:var(--on);display:flex;align-items:center;gap:10px;padding:10px 14px}
header img{height:34px;width:34px;object-fit:contain;border-radius:6px;background:#fff3}
header .hd{flex:1;min-width:0}
header h1{font-size:1.05rem;margin:0;font-weight:700}
header small{opacity:.85}
header button{background:#0003;color:inherit;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:.85rem}
header button.st{display:block;background:none;padding:0;margin-top:2px;font-size:.75rem;opacity:.9;text-align:left;border-radius:0}
main{flex:1;overflow-y:auto;padding:12px;max-width:640px;width:100%;margin:0 auto}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);overflow-x:auto}
nav button{flex:1;min-width:64px;background:none;border:0;color:var(--mu);padding:12px 6px;font:inherit;font-size:.85rem;border-top:3px solid transparent}
nav button.on{color:var(--tx);font-weight:700;border-top-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:1.05rem;margin:0 0 10px}h3{margin:0 0 8px}
label{display:block;font-size:.85rem;color:var(--mu);margin:0 0 12px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);font:inherit;font-size:1rem}
textarea{min-height:110px}
input[type=color]{padding:2px;height:46px}
input[type=radio]{display:inline-block;width:auto;margin:0 6px 0 0}
details{margin-bottom:12px}
summary{color:var(--mu);font-size:.85rem;padding:4px 0}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:700;font-size:1rem;text-align:center;text-decoration:none}
.btn.ghost{background:var(--in);color:var(--tx);border:1px solid var(--bd);font-weight:400}
.seg{display:grid;grid-auto-flow:column;gap:6px;margin-bottom:12px}
.seg button{padding:12px 4px;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;font:inherit;font-size:.85rem}
.seg button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.opt{display:flex;justify-content:space-between;width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-top:6px;text-align:left}
.opt.new{border-style:dashed;color:var(--ac);font-weight:700}
.chip{color:var(--ok);font-size:.85rem;margin:-6px 0 10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row.void{opacity:.5;text-decoration:line-through}
.mu{color:var(--mu);font-size:.85rem}
.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.neg{color:var(--er)}
.sm{display:block;margin:4px 0 0 auto;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit;font-size:.8rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat.big{grid-column:span 2;border-color:var(--ac)}
.auth{max-width:380px;margin:0 auto;padding:40px 16px}
.err{color:var(--er);font-size:.9rem;margin-bottom:10px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5}
#modal.on{display:flex}
#modal>div{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
.ss{display:inline-block;width:auto;margin:0;padding:5px 6px;font-size:.8rem;border-radius:8px}
.pr{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.g3 label{margin:0}
.banner{border-color:var(--ac)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:.9rem;display:none;z-index:6;max-width:90%;text-align:center}
.auth::after{content:var(--ver);display:block;text-align:center;margin-top:18px;font-size:12px;opacity:.6}
</style>
</head>
<body>
<div id="app" style="display:contents"></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
/* Gegevens van het Google-project staan in config.js (eenmalig invullen). Je kan ze ook in de app invullen bij Meer > Geavanceerd. */
const QC=window.QCONFIG||{};
const GOOGLE_CLIENT_ID=String(QC.clientId||'').trim();
const GOOGLE_API_KEY=String(QC.apiKey||'').trim();
const GOOGLE_APP_ID=String(QC.appId||'').trim();
/* Enkel toegang tot spreadsheets die de app zelf aanmaakt of die de gebruiker zelf kiest. */
const SCOPE='https://www.googleapis.com/auth/drive.file';
const TAB_B='Boekingen',TAB_L='Leden',TAB_P='Prijzen',TAB_I='Instellingen';
const HEAD_P=['Hoofdcategorie','Subcategorie','Lid','Niet-lid','Oud-lid'];
const HEAD_B=['ID','Datum','Lid','Omschrijving','Hoofdcategorie','Subcategorie','Betaalwijze','Bedrag','Type','Verwijst naar','Ingevoerd door','Tijdstip','Rol'];

const APP_VERSION='8';document.documentElement.style.setProperty('--ver',`"Versie ${APP_VERSION}"`);
const REGK='quaestor-clubs';
let REG=null;try{REG=JSON.parse(localStorage.getItem(REGK)||'null')}catch(e){}
if(!REG||!Array.isArray(REG.list)||!REG.list.length)REG={active:'c1',list:[{id:'c1',name:'',color:'#8b1e3f',helper:false}]};
if(!REG.list.some(x=>x.id===REG.active))REG.active=REG.list[0].id;
const keyOf=id=>id==='c1'?'quaestor-v1':'quaestor-v1-'+id;
let K=keyOf(REG.active);
const sk=x=>String(x==null?'':x).trim().toLowerCase().replace(/[\s_-]+/g,'-');
const cleanSt=x=>String(x==null?'':x).trim().replace(/\s+/g,' ').slice(0,30);
const canonSt=x=>{const k=sk(x);return k?(S.statuses.find(y=>sk(y)===k)||''):''};
function addSt(x){const t=cleanSt(x);if(!t)return '';const c=canonSt(t);if(c)return c;S.statuses.push(t);if(!S.club.helperOnly)S.club.setDirty=true;return t}
function setStatuses(l){const out=[];const add=x=>{const t=cleanSt(x);if(t&&!out.some(y=>sk(y)===sk(t)))out.push(t)};l.forEach(add);S.members.forEach(m=>add(m.status));
 if(out.length)S.statuses=out;S.members.forEach(m=>{m.status=canonSt(m.status)||S.statuses[0]})}
const stOpts=sel=>S.statuses.map(x=>`<option value="${esc(x)}"${x===sel?' selected':''}>${esc(x)}</option>`).join('')+'<option value="__new">+ Nieuwe status…</option>';
const DEF=()=>({club:{name:'',color:'#8b1e3f',logo:'',theme:'auto',pinQ:'',pinH:'',gmode:'new',gurl:''},cats:{h:['Cantus','Weekend','Andere'],s:['Introcantus','Bierbowling','Lidgeld','Schuld']},members:[],tx:[],prices:[],pricesDirty:false,statuses:['lid','niet-lid','oud-lid'],delM:[],pendDel:[]});
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR'}).format(n);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const M={cash:'Cash',payconiq:'Payconiq',overschrijving:'Overschrijving',schuld:'Schuldenlijst'};
let S=null,role=null,tab='boek',DAY=today(),LQ='',ASK=null;
const newB=()=>({mid:null,name:'',amt:'',desc:'',method:'cash',h:'',s:'',man:false});
let B=newB();
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
if(!S)S=DEF();
function norm(){
 if(Array.isArray(S.cats)){const o=S.cats;S.cats={h:o.map(c=>c.h),s:[...new Set(o.flatMap(c=>c.s))]}}
 S.club=Object.assign({gid:'',gok:false,gcreated:false,gpicked:false,gname:'',catTab:'Categorieën',cid:'',akey:'',appid:'',gmode:'new',gurl:'',gscope:'',helperOnly:false,wipeTs:0,inviteGid:'',salt:'',pinQh:'',pinHh:'',setDirty:false,setTs:0,askName:false},S.club);
 if(S.club.gscope!==SCOPE){if(S.club.gid||S.club.gok){S.club.gok=false;if(S.club.gmode==='existing')S.club.gpicked=false;try{sessionStorage.removeItem('qg')}catch(e){}}S.club.gscope=SCOPE}
 S.sync=Object.assign({last:0,err:'',auth:false,pick:false,warn:''},S.sync||{});
 S.club.names=Object.assign({q:'',h:''},S.club.names||{});
 S.delM=Array.isArray(S.delM)?S.delM:[];S.pendDel=Array.isArray(S.pendDel)?S.pendDel:[];
 S.members=S.members||[];S.tx=S.tx||[];S.prices=S.prices||[];S.pricesDirty=!!S.pricesDirty;delete S.opening;
 S.statuses=(Array.isArray(S.statuses)?S.statuses.map(cleanSt).filter(Boolean):[]);if(!S.statuses.length)S.statuses=['lid','niet-lid','oud-lid'];
 S.members.forEach(m=>{m.status=addSt(m.status)||S.statuses[0]})}
norm();save();
function save(){try{localStorage.setItem(K,JSON.stringify(S));const e=REG.list.find(x=>x.id===REG.active);
 if(e){e.name=S.club.name||'';e.color=S.club.color;e.helper=!!S.club.helperOnly}localStorage.setItem(REGK,JSON.stringify(REG))}catch(e){toast('Opslaan op dit toestel lukt niet')}}
const emptyClub=s=>!s.club.pinQ&&!s.club.pinQh&&!s.club.helperOnly;
function removeProfile(id){try{localStorage.removeItem(keyOf(id))}catch(e){}REG.list=REG.list.filter(x=>x.id!==id);if(!REG.list.length)REG.list.push({id:'c'+Date.now().toString(36),name:'',color:'#8b1e3f',helper:false})}
function loadProfile(id){const cur=REG.active;
 if(S&&cur!==id&&REG.list.length>1&&emptyClub(S))removeProfile(cur);
 REG.active=id;K=keyOf(id);let s=null;try{s=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
 S=s||DEF();norm();ENS='';LASTPULL=0;role=null;tab='boek';DAY=today();LQ='';PE=[];B=newB();theme();save()}
function newProfile(){const id='c'+Date.now().toString(36);REG.list.push({id,name:'',color:'#8b1e3f',helper:false});loadProfile(id)}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
function ask(t,yes,fn){ASK=fn;modal(`<h3>${t}</h3><button class="btn" onclick="askOk()">${yes}</button><button class="btn ghost" style="margin-top:8px" onclick="closeM()">Annuleren</button>`)}
function askOk(){const f=ASK;ASK=null;closeM();if(f)f()}
function theme(){const c=S.club,r=document.documentElement;r.style.setProperty('--ac',c.color);const n=parseInt(c.color.slice(1),16),l=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);r.style.setProperty('--on',l>150?'#111':'#fff');c.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',c.theme)}

/* ================= GOOGLE SHEETS ================= */
let WHO='';
let TOKEN=null,TEXP=0,SYNCING=false,SI=false,ENS='',LASTPULL=0,QT=null;
try{const q=JSON.parse(sessionStorage.getItem('qg')||'null');if(q&&q.exp>Date.now()){TOKEN=q.t;TEXP=q.exp}}catch(e){}
const cid=()=>(S.club.cid||GOOGLE_CLIENT_ID||'').trim();
const apiKey=()=>(S.club.akey||GOOGLE_API_KEY||'').trim();
const appId=()=>(S.club.appid||GOOGLE_APP_ID||'').trim();
const haveTok=()=>TOKEN&&Date.now()<TEXP-60000;
const autoOk=()=>S.club.gok&&S.club.gid;
const authErr=m=>{const e=new Error(m);e.auth=true;return e};
function loadGsi(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>res();s.onerror=()=>rej(new Error('Google kon niet geladen worden. Controleer je internetverbinding.'));document.head.appendChild(s)})}
function getToken(){return new Promise((res,rej)=>{
 if(haveTok())return res(TOKEN);
 if(!cid())return rej(authErr('Geen Google Client ID ingesteld. Zie de handleiding.'));
 loadGsi().then(()=>{
  const tc=google.accounts.oauth2.initTokenClient({client_id:cid(),scope:SCOPE,
   callback:r=>{if(r.error)return rej(authErr(r.error==='access_denied'?'Toegang geweigerd in Google.':'Google-fout: '+r.error));
    TOKEN=r.access_token;TEXP=Date.now()+(+r.expires_in||3600)*1000;try{sessionStorage.setItem('qg',JSON.stringify({t:TOKEN,exp:TEXP}))}catch(e){}
    if(!S.club.gok){S.club.gok=true;save()}res(TOKEN)},
   error_callback:()=>rej(authErr('Aanmelden bij Google is niet gelukt of werd geannuleerd.'))});
  tc.requestAccessToken({prompt:S.club.gok?'':'consent'})}).catch(rej)})}
async function api(path,opt){opt=opt||{};
 if(!haveTok()){if(!SI)throw authErr('Opnieuw verbinden nodig.');await getToken()}
 const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets'+path,{...opt,headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'}});
 if(r.status===401){TOKEN=null;try{sessionStorage.removeItem('qg')}catch(e){}throw authErr('Sessie verlopen. Tik op de status bovenaan om opnieuw te verbinden.')}
 if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}
  if((r.status===403||r.status===404)&&path.indexOf('/'+S.club.gid)===0&&!/not been used|disabled|API has/i.test(m)){const e=new Error('Geen toegang tot deze spreadsheet. Kies ze opnieuw. Lukt het niet, vraag de Quaestor om je als bewerker toe te voegen.');e.pick=true;throw e}
  throw new Error(m||('Google-fout '+r.status))}
 return r.json()}
function loadPicker(){return new Promise((res,rej)=>{if(window.google&&google.picker)return res();
 const go=()=>gapi.load('picker',{callback:res,onerror:()=>rej(new Error('De Google-keuzelijst kon niet geladen worden.'))});
 if(window.gapi&&gapi.load)return go();
 const s=document.createElement('script');s.src='https://apis.google.com/js/api.js';s.onload=go;s.onerror=()=>rej(new Error('Google kon niet geladen worden. Controleer je internetverbinding.'));document.head.appendChild(s)})}
function pickFile(tok){return new Promise(res=>{const v=new google.picker.View(google.picker.ViewId.SPREADSHEETS);
 new google.picker.PickerBuilder().setAppId(appId()).setDeveloperKey(apiKey()).setOAuthToken(tok).setLocale('nl').setTitle('Kies je spreadsheet').addView(v)
  .setCallback(d=>{const a=d[google.picker.Response.ACTION];
   if(a===google.picker.Action.PICKED){const x=d[google.picker.Response.DOCUMENTS][0];res({id:x[google.picker.Document.ID],name:x[google.picker.Document.NAME]})}
   else if(a===google.picker.Action.CANCEL)res(null)}).build().setVisible(true)})}
const parseId=u=>{const m=String(u||'').match(/\/d\/([a-zA-Z0-9_-]+)/)||String(u||'').trim().match(/^([a-zA-Z0-9_-]{25,})$/);return m?m[1]:''};
const rng=(tab,a)=>`'${tab.replace(/'/g,"''")}'!${a}`;
const enc=encodeURIComponent;
const cell=v=>typeof v==='string'&&/^[=+\-@]/.test(v)?"'"+v:v;
const typ=t=>t.storno?'Storno':t.ref?'Afbetaling':'Boeking';
const rowOf=t=>[ "'"+t.id,t.date,cell(t.name||''),cell(t.desc||''),cell(t.h||''),cell(t.s||''),M[t.method],t.v,typ(t),t.ref?"'"+t.ref:'',cell(t.who||(t.by==='q'?'Quaestor':'Helper')),"'"+new Date(t.ts).toISOString(),t.by==='q'?'Quaestor':'Helper'];
async function append(tab,cols,rows){for(let i=0;i<rows.length;i+=200)await api(`/${S.club.gid}/values/${enc(rng(tab,cols))}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,{method:'POST',body:JSON.stringify({values:rows.slice(i,i+200)})})}
async function head(tab,hd){const d=await api(`/${S.club.gid}/values/${enc(rng(tab,'A1:Z1'))}`);const v=(d.values||[])[0];
 if(!v||!v.some(x=>String(x||'').trim())){await api(`/${S.club.gid}/values/${enc(rng(tab,'A1'))}?valueInputOption=RAW`,{method:'PUT',body:JSON.stringify({values:[hd]})});return}
 if(String(v[0]).trim()!==hd[0])throw new Error(`Het tabblad ‘${tab}’ bestaat al en hoort niet bij de app. Geef het een andere naam of verwijder het.`)}
async function putCats(){const c=S.cats,n=Math.max(c.h.length,c.s.length),v=[['Hoofdcategorie','Subcategorie']];for(let i=0;i<n;i++)v.push([c.h[i]||'',c.s[i]||'']);
 await api(`/${S.club.gid}/values/${enc(rng(S.club.catTab,'A1'))}?valueInputOption=RAW`,{method:'PUT',body:JSON.stringify({values:v})})}
async function ensureSheet(){const c=S.club;let created=[];
 if([TAB_B,TAB_L,TAB_P,TAB_I].includes(c.catTab))throw new Error('Het tabblad voor categorieën mag niet Boekingen, Leden, Prijzen of Instellingen heten.');
 if(c.gmode==='new'&&!c.gcreated){
  const r=await api('',{method:'POST',body:JSON.stringify({properties:{title:(c.name||'Club')+' – betalingen'},sheets:[TAB_B,TAB_L,c.catTab].map(t=>({properties:{title:t}}))})});
  c.gid=r.spreadsheetId;c.gcreated=true;c.gpicked=false;c.gname='';S.tx.forEach(t=>t.synced=false);S.members.forEach(m=>m.on=false);S.delM=[];save();created=[c.catTab]}
 else{
  const m=await api(`/${c.gid}?fields=sheets.properties.title`),titles=(m.sheets||[]).map(s=>s.properties.title);
  const need=[TAB_B,TAB_L,c.catTab].filter((t,i,a)=>!titles.includes(t)&&a.indexOf(t)===i);
  if(need.length)await api(`/${c.gid}:batchUpdate`,{method:'POST',body:JSON.stringify({requests:need.map(t=>({addSheet:{properties:{title:t}}}))})});
  created=need.filter(t=>t===c.catTab)}
 await head(TAB_B,HEAD_B);await rolCol();await head(TAB_L,['Naam','Status'])}
async function rolCol(){const u=`/${S.club.gid}/values/${enc(rng(TAB_B,'M1'))}`,d=await api(u);
 if(!(d.values&&d.values[0]&&String(d.values[0][0]||'').trim()))await api(u+'?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({values:[['Rol']]})})}
async function pullCats(){const d=await api(`/${S.club.gid}/values/${enc(rng(S.club.catTab,'A:B'))}`);
 let rows=(d.values||[]).filter(r=>r.some(x=>String(x||'').trim()));
 if(!rows.length){await putCats();return false}
 if(/^hoofd/i.test(String(rows[0][0]||'').trim()))rows=rows.slice(1);
 const h=[...new Set(rows.map(r=>String(r[0]||'').trim()).filter(Boolean))],s=[...new Set(rows.map(r=>String(r[1]||'').trim()).filter(Boolean))];
 if(!h.length)return false;
 const ch=JSON.stringify(S.cats)!==JSON.stringify({h,s});S.cats={h,s};return ch}
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPin(pin,salt){const te=new TextEncoder(),k=await crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveBits']);
 const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:te.encode(salt),iterations:100000},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

 return delBanner()+hb+`<div class="card">

 <div class="card"><h2>${S.members.length} leden</h2>${S.club.gid?'<button class="btn ghost" style="margin-bottom:10px" onclick="sync(true)">Nu synchroniseren</button>':''}<p class="mu">Status aanpassen kan hier, of in kolom B van het tabblad Leden in je spreadsheet (je mag zelf statussen typen, bv. schacht of actief student). De app neemt het over bij de volgende synchronisatie, meestal binnen een halve minuut.</p><label>Zoeken<input oninput="LQ=this.value;ml()"></label><div id="ml"></div></div>`}
function ml(){const e=$('#ml');if(!e)return;const q=LQ.toLowerCase(),o=open(),l=S.members.filter(m=>m.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
 e.innerHTML=l.length?l.map(m=>{const d=o.filter(t=>t.mid===m.id).reduce((a,t)=>a+t.v,0);return `<div class="row"><div>${esc(m.name)}${d?`<div class="neg">Schuld ${eur(d)}</div>`:''}</div><div><select class="ss" aria-label="Status van ${esc(m.name)}" onchange="stSel(this,'${m.id}',false)">${stOpts(m.status)}</select><button class="sm" onclick="delM('${m.id}')">Verwijder</button></div></div>`}).join(''):empty('Geen leden gevonden.')}
function addM(){const n=$('#mn').value.trim();if(!n)return toast('Vul een naam in');unDel(n);S.members.push({id:uid(),name:n,status:cleanSt($('#ms2').value)?addSt($('#ms2').value):$('#ms').value,dirty:true});save();render();queueSync()}
const unDel=n=>{S.delM=S.delM.filter(x=>x.toLowerCase()!==String(n).toLowerCase())};
function delM(id){const m0=S.members.find(x=>x.id===id);if(!m0)return;
 ask('Dit lid verwijderen uit de lijst? Bestaande boekingen blijven staan.'+(S.club.gid?' Het lid wordt ook uit het tabblad Leden van je spreadsheet verwijderd.':''),'Verwijderen',()=>{S.delM.push(m0.name);S.members=S.members.filter(m=>m.id!==id);save();render();queueSync()})}
function impM(){modal(`<h3>Ledenlijst plakken</h3><p class="mu">Eén lid per regel: naam, of naam en status (bv. schacht of actief student) gescheiden door een tab of puntkomma. Je kan dus kolommen uit je spreadsheet kopiëren.</p><textarea id="it"></textarea><button class="btn" style="margin-top:10px" onclick="impOk()">Importeren</button>`)}
function impOk(){let n=0;$('#it').value.split(/\r?\n/).forEach(l=>{const p=l.split(/[;\t]/).map(x=>x.trim());if(!p[0]||/^naam$/i.test(p[0]))return;if(S.members.some(m=>m.name.toLowerCase()===p[0].toLowerCase()))return;unDel(p[0]);S.members.push({id:uid(),name:p[0],status:p[1]?addSt(p[1]):S.statuses[0],dirty:true});n++});save();closeM();toast(n+' leden toegevoegd');render();queueSync()}

/* ---------- instellingen ---------- */
function catCard(){const c=S.club;
 if(c.gid)return `<div class="card"><h2>Categorieën</h2><p class="mu">De categorieën worden gelezen uit het tabblad ‘${esc(c.catTab)}’ van je spreadsheet (kolom A hoofdcategorieën, kolom B subcategorieën). Pas ze daar aan en tik daarna op Opslaan en nu synchroniseren, of tik bovenaan op de status. Nu: ${S.cats.h.length} hoofd- en ${S.cats.s.length} subcategorieën.</p></div>`;
 return `<div class="card"><h2>Categorieën</h2><p class="mu">Kopieer de kolom met hoofdcategorieën uit je spreadsheet en plak ze in het eerste veld, doe hetzelfde met de subcategorieën in het tweede veld. Eén per regel. Zodra je een spreadsheet koppelt, worden ze daaruit gelezen.</p>
 <label>Hoofdcategorieën<textarea id="ich">${esc(S.cats.h.join('\n'))}</textarea></label><label>Subcategorieën<textarea id="ics">${esc(S.cats.s.join('\n'))}</textarea></label></div>`}
function statCard(){return `<div class="card"><h2>Ledenstatussen</h2><p class="mu">Eén status per regel, bijvoorbeeld schacht, actief student of oud student. Statussen die nog in gebruik zijn, blijven staan. Typ je in de spreadsheet een nieuwe status in het tabblad Leden, dan voegt de app ze zelf toe.</p><label>Statussen<textarea id="ist">${esc(S.statuses.join('\n'))}</textarea></label></div>`}
function prCard(){const n=S.prices.length;return `<div class="card"><h2>Prijzen per ledenstatus</h2><p class="mu">Stel per categorie een bedrag in voor elke ledenstatus. Bij een boeking vult de app het bedrag zelf in.${S.club.gid?' De prijzen staan ook in het tabblad Prijzen van je spreadsheet. Je kan ze daar ook aanpassen.':''} Nu: ${n} ${n===1?'rij':'rijen'}.</p><button class="btn ghost" onclick="prEdit()">Prijzen bewerken</button></div>`}
let PE=[];
const prRow=()=>({h:S.cats.h[0]||'',s:'',p:{}});
function prEdit(){PE=JSON.parse(JSON.stringify(S.prices));if(!PE.length)PE.push(prRow());prShow()}
function prShow(){modal(`<h3>Prijzen per ledenstatus</h3><p class="mu">Laat de subcategorie leeg als het bedrag voor de hele hoofdcategorie geldt. Een rij met subcategorie gaat voor op een rij zonder. Laat een bedrag leeg als er geen tarief is.</p>${PE.map((r,i)=>`<div class="pr"><label>Hoofdcategorie<select onchange="PE[${i}].h=this.value">${opts(S.cats.h.includes(r.h)?S.cats.h:[r.h].concat(S.cats.h),r.h)}</select></label><label>Subcategorie<select onchange="PE[${i}].s=this.value">${opts(!r.s||S.cats.s.includes(r.s)?S.cats.s:[r.s].concat(S.cats.s),r.s,true)}</select></label><div class="g3">${S.statuses.map(k=>`<label>${esc(k)}<input inputmode="decimal" data-s="${esc(k)}" value="${r.p[k]==null?'':esc(String(r.p[k]).replace('.',','))}" oninput="PE[${i}].p[this.dataset.s]=pnum(this.value)"></label>`).join('')}</div><button class="sm" onclick="PE.splice(${i},1);prShow()">Rij verwijderen</button></div>`).join('')}<button class="btn ghost" onclick="PE.push(prRow());prShow()">+ Rij toevoegen</button><button class="btn" style="margin-top:8px" onclick="prSave()">Opslaan</button>`)}
function prSave(){const m=new Map();PE.forEach(r=>{if(!r.h)return;if(S.statuses.every(k=>r.p[k]==null))return;m.set(r.h.toLowerCase()+'|'+(r.s||'').toLowerCase(),{h:r.h,s:r.s||'',p:Object.fromEntries(S.statuses.map(k=>[k,r.p[k]==null?null:r.p[k]]))})});
 S.prices=[...m.values()];S.pricesDirty=true;save();closeM();toast('Prijzen opgeslagen');autoPrice();render();queueSync()}
function inviteLink(){const c=S.club,o={v:1,i:c.gid,n:c.name,c:c.color,t:c.catTab};if(c.cid)o.ci=c.cid;if(c.akey)o.ak=c.akey;if(c.appid)o.ap=c.appid;
 return location.href.split('#')[0].split('?')[0]+'#join='+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function invCard(){const c=S.club;
 if(!c.gid||!c.gok)return `<div class="card"><h2>Helpers uitnodigen</h2><p class="mu">Koppel eerst Google Sheets. Daarna kan je hier een uitnodigingslink voor helpers maken, zodat ze op hun eigen gsm meewerken in dezelfde spreadsheet.</p></div>`;
 return `<div class="card"><h2>Helpers uitnodigen</h2><p class="mu">Elke helper werkt op zijn eigen gsm, alles komt in dezelfde spreadsheet.</p><ol class="mu" style="padding-left:20px;margin:0 0 12px"><li>Open je spreadsheet, tik op Delen en voeg het Google-account van de helper toe als <b>bewerker</b>.</li><li>Stuur de helper de uitnodigingslink hieronder.</li><li>De helper opent de link op zijn gsm, kiest een pincode, meldt aan bij Google en kiest de gedeelde spreadsheet.</li></ol>
 <button class="btn" onclick="shareInv()">Uitnodigingslink delen</button><button class="btn ghost" style="margin-top:8px" onclick="showT('Uitnodigingslink',inviteLink())">Link kopiëren</button><a class="btn ghost" style="margin-top:8px" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/${esc(c.gid)}">Spreadsheet openen om te delen</a>
 <p class="mu" style="margin-top:12px">De link bevat geen pincodes en geeft zelf geen toegang tot je gegevens. Dat gebeurt pas als je de spreadsheet deelt.</p></div>`}
function shareInv(){const l=inviteLink();if(navigator.share)navigator.share({title:S.club.name,text:'Uitnodiging als helper bij '+S.club.name,url:l}).catch(()=>{});else showT('Uitnodigingslink',l)}
function resetAll(){S=DEF();norm();ENS='';TOKEN=null;TEXP=0;LASTPULL=0;PE=[];B=newB();
 try{sessionStorage.removeItem('qg')}catch(e){}save();role=null;tab='boek';start()}
function devOff(){const n=S.tx.filter(t=>!t.synced).length;ask('Dit toestel loskoppelen? Alle gegevens op dit toestel worden gewist.'+(n?` ${n} boeking(en) zijn nog niet geüpload en gaan verloren.`:''),'Loskoppelen',()=>{resetAll();toast('Toestel losgekoppeld')})}
function wipeTx(){const n=S.tx.length,u=S.tx.filter(t=>!t.synced).length,g=S.club.gid&&S.club.gok;
 modal(`<h3>Alle ${n} boekingen wissen?</h3>${u?`<p class="neg">${u} boeking(en) zijn nog niet geüpload en gaan verloren.</p>`:''}<p class="mu">Wissen in de spreadsheet is niet te herstellen, tenzij je de versiegeschiedenis van Google Sheets gebruikt.</p>
 <button class="btn ghost" onclick="wipeTxGo(false)">Alleen op dit toestel wissen</button><p class="mu" style="margin:4px 0 10px">${g?'De boekingen blijven in je spreadsheet staan als archief. Andere toestellen houden hun kopie.':''}</p>
 ${g?`<button class="btn" onclick="wipeTxSheet()">Ook uit de spreadsheet wissen</button><p class="mu" style="margin:4px 0 10px">Alle rijen in het tabblad Boekingen verdwijnen. Helpers krijgen de vraag of ze hun kopie ook willen wissen of bewaren.</p>`:''}
 <button class="btn ghost" onclick="closeM()">Annuleren</button>`)}
function wipeTxSheet(){if(role!=='q')return;modal(`<h3>Ook uit de spreadsheet wissen</h3><p>Alle rijen in het tabblad Boekingen verdwijnen voor iedereen. Dit is niet ongedaan te maken in de app. Typ WISSEN om te bevestigen.</p><input id="wc2" autocomplete="off"><button class="btn" style="margin-top:10px" onclick="wipeTxSheetOk()">Definitief wissen</button><button class="btn ghost" style="margin-top:8px" onclick="closeM()">Annuleren</button>`)}
function wipeTxSheetOk(){if(($('#wc2').value||'').trim().toUpperCase()!=='WISSEN')return toast('Typ WISSEN om te bevestigen');wipeTxGo(true)}
async function wipeTxGo(sheet){if(role!=='q')return;closeM();
 if(sheet){SI=true;try{await api(`/${S.club.gid}/values/${enc(rng(TAB_B,'A2:M'))}:clear`,{method:'POST',body:'{}'})}catch(e){SI=false;return toast(e.message||'Wissen in de spreadsheet is niet gelukt')}SI=false}
 S.tx=[];S.club.wipeTs=Date.now();save();render();toast(sheet?'Boekingen gewist, ook in de spreadsheet':'Boekingen gewist op dit toestel')}
function wipeMem(){const g=S.club.gid&&S.club.gok;
 ask('De ledenlijst leegmaken?'+(g?' Ook de lijst in het tabblad Leden van je spreadsheet wordt leeggemaakt, anders komt ze terug.':'')+' Bestaande boekingen blijven staan.','Leegmaken',async()=>{
  if(g){SI=true;try{await api(`/${S.club.gid}/values/${enc(rng(TAB_L,'A2:B'))}:clear`,{method:'POST',body:'{}'})}catch(e){SI=false;return toast(e.message||'Leegmaken in de spreadsheet is niet gelukt')}SI=false}
  S.members=[];save();render();toast('Ledenlijst leeggemaakt')})}
function wipeAll(){const u=S.tx.filter(t=>!t.synced).length;modal(`<h3>Alles wissen</h3><p>Dit wist op dit toestel de instellingen, pincodes, leden, prijzen en boekingen.${u?` ${u} boeking(en) zijn nog niet geüpload en gaan verloren.`:''} Je spreadsheet blijft bestaan. Typ WISSEN om te bevestigen.</p><input id="wc" autocomplete="off"><button class="btn" style="margin-top:10px" onclick="wipeAllOk()">Alles wissen</button>`)}
function wipeAllOk(){if(($('#wc').value||'').trim().toUpperCase()!=='WISSEN')return toast('Typ WISSEN om te bevestigen');closeM();resetAll();toast('Alles gewist')}
function gCard(){const c=S.club,on=!!c.gid&&c.gok,ex=c.gmode==='existing',tg="document.getElementById('pk').style.display=this.value==='existing'?'block':'none'";
 return `<div class="card"><h2>Google Sheets</h2><p class="mu" id="gst">${esc(gStatus())}</p>
 <label style="color:var(--tx)"><input type="radio" name="gm" value="new"${!ex?' checked':''} onchange="${tg}">Nieuwe aparte spreadsheet laten aanmaken</label>
 <label style="color:var(--tx)"><input type="radio" name="gm" value="existing"${ex?' checked':''} onchange="${tg}">Bestaande spreadsheet gebruiken, de app voegt nieuwe tabbladen toe</label>
 <div id="pk" style="display:${ex?'block':'none'}"><p class="mu">${c.gpicked?`Gekozen spreadsheet: <b>${esc(c.gname||c.gid)}</b>`:'Nog geen spreadsheet gekozen.'} De app krijgt enkel toegang tot de spreadsheet die je zelf kiest.</p>
 <button class="btn ghost" style="margin-bottom:12px" onclick="choose()">Spreadsheet kiezen</button></div>
 <label>Tabblad met je categorieën<input id="ict" value="${esc(c.catTab)}"></label>
 <p class="mu" style="margin-top:-6px">De app maakt de tabbladen Boekingen en Leden aan, en gebruikt je categorietabblad. Bestaat dat nog niet, dan maakt de app het aan met je huidige lijst.</p>
 <details><summary>Geavanceerd</summary>
  <label>Google Client ID<input id="icid" value="${esc(c.cid)}" placeholder="${GOOGLE_CLIENT_ID?'Standaard van de app':'xxxx.apps.googleusercontent.com'}"></label>
  <label>API-sleutel (voor de keuzelijst)<input id="iak" value="${esc(c.akey)}" placeholder="${GOOGLE_API_KEY?'Standaard van de app':'AIza…'}"></label>
  <label>Projectnummer<input id="iap" value="${esc(c.appid)}" placeholder="${GOOGLE_APP_ID?'Standaard van de app':'123456789012'}"></label></details>
 <button class="btn" onclick="connect()">${on?'Opslaan en nu synchroniseren':'Verbinden met Google'}</button>
 ${c.gid?`<a class="btn ghost" style="margin-top:8px" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/${esc(c.gid)}">Spreadsheet openen</a><button class="btn ghost" style="margin-top:8px" onclick="unlink()">Ontkoppelen</button>`:''}
 <p class="mu" style="margin-top:12px">De app vraagt alleen toegang tot spreadsheets die ze zelf aanmaakt of die je zelf kiest. <a href="privacy.html" target="_blank" rel="noopener">Privacyverklaring</a></p></div>`}
function vInst(){const c=S.club;
 return `<div class="card"><h2>Club</h2><label>Naam<input id="in" value="${esc(c.name)}"></label><label>Clubkleur<input type="color" id="ic" value="${c.color}"></label>
 <label>Logo<input type="file" accept="image/*" onchange="logo(this)"></label>${c.logo?'<button class="btn ghost" onclick="S.club.logo=\'\';save();render()">Logo verwijderen</button>':''}
 <label style="margin-top:12px">Weergave<select id="it2"><option value="auto"${c.theme==='auto'?' selected':''}>Volgt je toestel</option><option value="light"${c.theme==='light'?' selected':''}>Licht</option><option value="dark"${c.theme==='dark'?' selected':''}>Donker</option></select></label></div>
 <div class="card"><h2>Jouw naam</h2><label>Naam van de Quaestor<input id="iw" value="${esc(c.names.q)}"></label><label>Naam vragen bij elke keer inloggen<select id="ia"><option value="0">Nee</option><option value="1"${c.askName?' selected':''}>Ja, handig als meerdere mensen dit toestel gebruiken</option></select></label></div>
 <div class="card"><h2>Pincodes</h2><label>Pincode Quaestor<input id="iq" type="password" inputmode="numeric" value="${esc(c.pinQ)}" placeholder="${c.pinQh&&!c.pinQ?'(ongewijzigd)':''}"></label><label>Pincode Helper<input id="ih" type="password" inputmode="numeric" value="${esc(c.pinH)}" placeholder="${c.pinHh&&!c.pinH?'(ongewijzigd)':''}"></label></div>
 ${catCard()}${statCard()}${prCard()}${gCard()}${invCard()}
 <button class="btn" onclick="saveSet()">Instellingen opslaan</button>
 <div class="card" style="margin-top:12px"><h2>Back-up</h2><button class="btn ghost" onclick="showT('Boekingen als csv',csv())">Boekingen kopiëren (csv)</button><button class="btn ghost" style="margin-top:8px" onclick="showT('Volledige back-up',JSON.stringify(S))">Volledige back-up kopiëren</button><button class="btn ghost" style="margin-top:8px" onclick="restore()">Back-up terugzetten</button></div>
 <div class="card"><h2>Gegevens wissen</h2><p class="mu">Maak eerst een back-up als je twijfelt. Bij boekingen en de ledenlijst kies je of de spreadsheet ook meegaat. Bij Alles wissen blijft de spreadsheet staan.</p><button class="btn ghost" onclick="wipeTx()">Alle boekingen wissen</button><button class="btn ghost" style="margin-top:8px" onclick="wipeMem()">Ledenlijst leegmaken</button><button class="btn ghost" style="margin-top:8px;color:var(--er)" onclick="wipeAll()">Alles wissen en opnieuw beginnen</button></div>
 <p class="mu" style="text-align:center">Versie ${APP_VERSION}</p>`}
function saveSet(){const q=$('#iq').value.trim(),h=$('#ih').value.trim(),c0=S.club;
 if((q&&q.length<4)||(h&&h.length<4)||(!q&&!c0.pinQh)||(!h&&!c0.pinHh)||(q&&q===h))return toast('Pincodes: minstens 4 cijfers en niet gelijk');
 if($('#ich')){const list=id=>[...new Set($(id).value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];
  const ch=list('#ich'),cs=list('#ics');if(!ch.length)return toast('Voeg minstens één hoofdcategorie toe');S.cats={h:ch,s:cs}}
 Object.assign(S.club,{name:$('#in').value.trim()||S.club.name,color:$('#ic').value,theme:$('#it2').value,pinQ:q||S.club.pinQ,pinH:h||S.club.pinH,setDirty:true});
 if($('#ist')){const l=$('#ist').value.split(/\r?\n/).map(cleanSt).filter(Boolean);if(!l.length)return toast('Voeg minstens één status toe');const old=JSON.stringify(S.statuses);setStatuses(l);if(JSON.stringify(S.statuses)!==old){S.club.setDirty=true;if(S.prices.length)S.pricesDirty=true;S.members.forEach(m=>m.dirty=true)}}
 const iw=($('#iw').value||'').trim().slice(0,40);if(iw.length>=2){S.club.names.q=iw;if(role==='q')WHO=iw}S.club.askName=$('#ia').value==='1';
 readG();theme();toast('Opgeslagen');render()}
function logo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.club.logo=c.toDataURL('image/png');save();render()};im.src=r.result};r.readAsDataURL(f)}
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return ['id;datum;lid;omschrijving;hoofdcategorie;subcategorie;betaalwijze;bedrag;status;ingevoerd door'].concat(S.tx.map(t=>[t.id,t.date,t.name,t.desc,t.h,t.s,M[t.method],String(t.v).replace('.',','),t.storno?'storno':t.void?'gestorneerd':'ok',t.who||(t.by==='q'?'Quaestor':'Helper')].map(q).join(';'))).join('\n')}
function showT(t,x){modal(`<h3>${t}</h3><textarea id="tx" readonly>${esc(x)}</textarea><button class="btn" style="margin-top:10px" onclick="cp()">Kopiëren</button>`)}
function cp(){const e=$('#tx');e.select();try{navigator.clipboard.writeText(e.value).then(()=>toast('Gekopieerd'),()=>document.execCommand('copy'))}catch(x){try{document.execCommand('copy');toast('Gekopieerd')}catch(y){toast('Selecteer de tekst en kopieer ze zelf')}}}
function restore(){modal(`<h3>Back-up terugzetten</h3><p class="mu">Plak hier de volledige back-up. Alles op dit toestel wordt vervangen.</p><textarea id="rt"></textarea><button class="btn" style="margin-top:10px" onclick="restoreOk()">Terugzetten</button>`)}
function restoreOk(){try{const d=JSON.parse($('#rt').value);if(!d.club||!Array.isArray(d.tx)||!d.cats)throw 0;S=d;norm();ENS='';save();theme();closeM();render();toast('Back-up teruggezet')}catch(e){toast('Dit is geen geldige back-up')}}

start();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){const had=!!navigator.serviceWorker.controller,t0=Date.now();let rl=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl&&Date.now()-t0<15000){rl=true;location.reload()}});
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}
</script>
</body>
</html>
