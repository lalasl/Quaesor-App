<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quaestor – ledenbetalingen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#8b1e3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quaestor">
<style>
:root{--bg:#eef0f3;--card:#fff;--tx:#16181d;--mu:#646a76;--bd:#d9dde3;--ac:#8b1e3f;--on:#fff;--ok:#1b7a4b;--er:#b3261e;--in:#f6f7f9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1a1d23;--tx:#eceef2;--mu:#9aa1ad;--bd:#2d323b;--ok:#5cc896;--er:#f28b82;--in:#12151a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--card:#1a1d23;--tx:#eceef2;--mu:#9aa1ad;--bd:#2d323b;--ok:#5cc896;--er:#f28b82;--in:#12151a;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--ac);color:var(--on);display:flex;align-items:center;gap:10px;padding:10px 14px}
header img{height:34px;width:34px;object-fit:contain;border-radius:6px;background:#fff3}
header .hd{flex:1;min-width:0}
header h1{font-size:1.05rem;margin:0;font-weight:700}
header small{opacity:.85}
header button{background:#0003;color:inherit;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:.85rem}
header button.st{display:block;background:none;padding:0;margin-top:2px;font-size:.75rem;opacity:.9;text-align:left;border-radius:0}
main{flex:1;overflow-y:auto;padding:12px;max-width:640px;width:100%;margin:0 auto}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);overflow-x:auto}
nav button{flex:1 1 auto;min-width:0;white-space:nowrap;background:none;border:0;color:var(--mu);padding:12px 3px;font:inherit;font-size:.8rem;border-top:3px solid transparent}
nav button.on{color:var(--tx);font-weight:700;border-top-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:1.05rem;margin:0 0 10px}h3{margin:0 0 8px}
label{display:block;font-size:.85rem;color:var(--mu);margin:0 0 12px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);font:inherit;font-size:1rem}
textarea{min-height:110px}
input[type=color]{padding:2px;height:46px}
input[type=radio]{display:inline-block;width:auto;margin:0 6px 0 0}
details{margin-bottom:12px}
summary{color:var(--mu);font-size:.85rem;padding:4px 0}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:700;font-size:1rem;text-align:center;text-decoration:none}
.btn.ghost{background:var(--in);color:var(--tx);border:1px solid var(--bd);font-weight:400}
.seg{display:grid;grid-auto-flow:column;gap:6px;margin-bottom:12px}
.seg button{padding:12px 4px;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;font:inherit;font-size:.85rem}
.seg button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.opt{display:flex;justify-content:space-between;width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-top:6px;text-align:left}
.opt.new{border-style:dashed;color:var(--ac);font-weight:700}
.chip{color:var(--ok);font-size:.85rem;margin:-6px 0 10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row.void{opacity:.5;text-decoration:line-through}
.mu{color:var(--mu);font-size:.85rem}
.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.neg{color:var(--er)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--tx);font:inherit;font-weight:600;font-size:.95rem;padding:4px 0;margin:0 0 10px;cursor:pointer}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns .btn{margin:0!important}
.lnk{background:none;border:0;padding:2px 0;color:var(--mu);font:inherit;font-size:.8rem;text-decoration:underline;cursor:pointer}
.sm{display:block;margin:4px 0 0 auto;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit;font-size:.8rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat.big{grid-column:span 2;border-color:var(--ac)}
.auth{max-width:380px;margin:0 auto;padding:40px 16px}
.err{color:var(--er);font-size:.9rem;margin-bottom:10px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5}
#modal.on{display:flex}
#modal>div{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
.ss{display:inline-block;width:auto;max-width:150px;margin:0;padding:5px 6px;font-size:.8rem;border-radius:8px}
.pr{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.g3 label{margin:0}
.banner{border-color:var(--ac)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:.9rem;display:none;z-index:6;max-width:90%;text-align:center}
.auth::after{content:var(--ver);display:block;text-align:center;margin-top:18px;font-size:12px;opacity:.6}
.acc{padding:12px 0;border-bottom:1px solid var(--bd)}.accd{margin:8px 0 0 0;padding:8px 0 4px 12px;border-left:3px solid var(--bd)}.acc:last-child{border:0}
.tag{display:inline-block;font-size:.72rem;padding:2px 7px;border-radius:99px;background:var(--in);border:1px solid var(--bd);margin:2px 2px 0 0;font-weight:400}
.tag.warn{border-color:var(--er);color:var(--er)}
.accb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.accb .btn{width:auto;padding:7px 11px;font-size:.85rem}
.bonimg{max-width:100%;max-height:260px;display:block;margin:0 auto 10px;border-radius:8px;border:1px solid var(--bd)}
.bonbig{max-width:100%;display:block;margin:0 auto;border-radius:8px}
.prog{height:6px;background:var(--in);border-radius:3px;overflow:hidden;margin:6px 0 10px}.prog>i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
details summary{cursor:pointer;color:var(--mu);font-size:.85rem;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}.chips button{border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:99px;padding:5px 11px;font:inherit;font-size:.85rem;cursor:pointer}.chips .mu{width:100%;margin:0}
.drow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:10px 2px;font:inherit;color:var(--tx);cursor:pointer;gap:10px}.drow:last-child{border:0}.drow>span:first-child{display:flex;flex-direction:column;gap:3px}.drt{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.dra{display:flex;flex-direction:column;align-items:flex-end}
</style>
</head>
<body>
<div id="app" style="display:contents"></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
/* Gegevens van het Google-project staan in config.js (eenmalig invullen). Je kan ze ook in de app invullen bij Meer > Geavanceerd. */
const QC=window.QCONFIG||{};
const GOOGLE_CLIENT_ID=String(QC.clientId||'').trim();
const GOOGLE_API_KEY=String(QC.apiKey||'').trim();
const GOOGLE_APP_ID=String(QC.appId||'').trim();
const DEV_EMAIL=String(QC.devEmail||'').trim().toLowerCase();
const isDev=e=>!!DEV_EMAIL&&String(e||'').toLowerCase()===DEV_EMAIL;
const RO=()=>role!=='q';
const RN={d:'Developer',q:'Quaestor',h:'Helper',p:'Praesidium'};
const effR=u=>isDev(u.e)?'q':u.r==='d'?'q':u.r;
/* Enkel toegang tot spreadsheets die de app zelf aanmaakt of die de gebruiker zelf kiest. */
const SCOPE='https://www.googleapis.com/auth/drive.file openid email';
const TAB_OV='Schulden (overzicht)',TAB_B='Boekingen',TAB_L='Leden',TAB_P='Prijzen',TAB_I='Instellingen',TAB_BN='Bonnetjes',TAB_BF='Bonnetjes-foto';
const HEAD_BN=['ID','Datum','Winkel','Totaal','Artikelen','Omschrijving','Ingediend door','Ingediend op','Status','Boeking-ID','Voorgeschoten door'];
const HEAD_P=['Hoofdcategorie','Subcategorie','Lid','Niet-lid','Oud-lid'];
const HEAD_B=['ID','Datum','Lid','Omschrijving','Hoofdcategorie','Subcategorie','Betaalwijze','Bedrag','Type','Verwijst naar','Ingevoerd door','Tijdstip','Rol'];

const APP_VERSION='37';document.documentElement.style.setProperty('--ver',`"Versie ${APP_VERSION}"`);
const REGK='quaestor-clubs';
let REG=null;try{REG=JSON.parse(localStorage.getItem(REGK)||'null')}catch(e){}
if(!REG||!Array.isArray(REG.list)||!REG.list.length)REG={active:'c1',list:[{id:'c1',name:'',color:'#8b1e3f',helper:false}]};
if(!REG.list.some(x=>x.id===REG.active))REG.active=REG.list[0].id;
const keyOf=id=>id==='c1'?'quaestor-v1':'quaestor-v1-'+id;
let K=keyOf(REG.active);
const sk=x=>String(x==null?'':x).trim().toLowerCase().replace(/[\s_-]+/g,'-');
const cleanSt=x=>String(x==null?'':x).trim().replace(/\s+/g,' ').slice(0,30);
const canonSt=x=>{const k=sk(x);return k?(S.statuses.find(y=>sk(y)===k)||''):''};
function addSt(x){const t=cleanSt(x);if(!t)return '';const c=canonSt(t);if(c)return c;S.statuses.push(t);if(role==='q')S.club.setDirty=true;return t}
function setStatuses(l){const out=[];const add=x=>{const t=cleanSt(x);if(t&&!out.some(y=>sk(y)===sk(t)))out.push(t)};l.forEach(add);S.members.forEach(m=>add(m.status));
 if(out.length)S.statuses=out;S.members.forEach(m=>{m.status=canonSt(m.status)||S.statuses[0]})}
const stOpts=sel=>S.statuses.map(x=>`<option value="${esc(x)}"${x===sel?' selected':''}>${esc(x)}</option>`).join('')+'<option value="__new">+ Nieuwe status…</option>';
const DEF=()=>({club:{name:'',color:'#8b1e3f',logo:'',theme:'auto',pinQ:'',pinH:'',gmode:'new',gurl:''},cats:{h:['Cantus','Weekend','Andere'],s:['Introcantus','Bierbowling','Lidgeld','Schuld']},members:[],tx:[],prices:[],pricesDirty:false,statuses:['lid','niet-lid','oud-lid'],delM:[],pendDel:[]});
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR'}).format(n);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const M={cash:'Cash',payconiq:'Payconiq',overschrijving:'Overschrijving',schuld:'Schuldenlijst',voorschot:'Voorgeschoten'};
const ML={cash:'Cash',payconiq:'Payconiq',overschrijving:'Overschrijving',schuld:'Later betalen',voorschot:'Voorgeschoten'};
let S=null,role=null,tab='boek',DAY=today(),LQ='',ASK=null;
const newB=()=>({mid:null,name:'',amt:'',desc:'',method:'cash',h:'',s:'',man:false});
let B=newB();
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
if(!S)S=DEF();
function norm(){
 if(Array.isArray(S.cats)){const o=S.cats;S.cats={h:o.map(c=>c.h),s:[...new Set(o.flatMap(c=>c.s))]}}
 S.club=Object.assign({gid:'',gok:false,gcreated:false,gpicked:false,gname:'',catTab:'Categorieën',cid:'',akey:'',appid:'',gmode:'new',gurl:'',gscope:'',helperOnly:false,wipeTs:0,inviteGid:'',salt:'',pinQh:'',pinHh:'',setDirty:false,setTs:0,askName:false,debtTab:'',lim:{},bkImp:0,pinMe:'',hOk:false,uTab:false,lastUser:'',sess:'',closedAt:0,closed:0,bonTab:false,dev:'',acc:{},accMid:0,accGid:'',accSig:'',accTs:0,accF:0,blocked:''},S.club);
 if(!S.club.dev)S.club.dev=uid().replace(/-/g,'');if(!S.club.acc||typeof S.club.acc!=='object'||Array.isArray(S.club.acc))S.club.acc={};
 if(S.club.gscope!==SCOPE){if(String(S.club.gscope||'').indexOf('drive.file')<0&&(S.club.gid||S.club.gok)){S.club.gok=false;if(S.club.gmode==='existing')S.club.gpicked=false;try{sessionStorage.removeItem('qg')}catch(e){}}S.club.gscope=SCOPE}
 S.sync=Object.assign({last:0,err:'',auth:false,pick:false,warn:''},S.sync||{});
 S.club.names=Object.assign({q:'',h:''},S.club.names||{});
 S.delM=Array.isArray(S.delM)?S.delM:[];S.users=Array.isArray(S.users)?S.users:[];S.bons=Array.isArray(S.bons)?S.bons:[];S.pendDel=Array.isArray(S.pendDel)?S.pendDel:[];
 S.members=S.members||[];S.tx=S.tx||[];S.prices=S.prices||[];S.pricesDirty=!!S.pricesDirty;delete S.opening;
 S.statuses=(Array.isArray(S.statuses)?S.statuses.map(cleanSt).filter(Boolean):[]);if(!S.statuses.length)S.statuses=['lid','niet-lid','oud-lid'];
 S.members.forEach(m=>{m.status=addSt(m.status)||S.statuses[0]})}
norm();save();
function save(){try{localStorage.setItem(K,JSON.stringify(S));const e=REG.list.find(x=>x.id===REG.active);
 if(e){e.name=S.club.name||'';e.color=S.club.color;e.helper=!!S.club.helperOnly;e.user=S.club.lastUser||''}localStorage.setItem(REGK,JSON.stringify(REG))}catch(e){toast('Opslaan op dit toestel lukt niet')}}
const emptyClub=s=>!s.club.pinQ&&!s.club.pinQh&&!s.club.helperOnly&&!(s.users||[]).length&&!s.club.gid;
function removeProfile(id){try{localStorage.removeItem(keyOf(id));const px=keyOf(id)+'-bon-';Object.keys(localStorage).filter(k=>k.indexOf(px)===0).forEach(k=>localStorage.removeItem(k))}catch(e){}REG.list=REG.list.filter(x=>x.id!==id);if(!REG.list.length)REG.list.push({id:'c'+Date.now().toString(36),name:'',color:'#8b1e3f',helper:false})}
function loadProfile(id){const cur=REG.active;
 if(S&&cur!==id&&REG.list.length>1&&emptyClub(S))removeProfile(cur);
 REG.active=id;K=keyOf(id);let s=null;try{s=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
 S=s||DEF();norm();ENS='';LASTPULL=0;role=null;tab='boek';DAY=today();LQ='';PE=[];B=newB();theme();save()}
function newProfile(){const id='c'+Date.now().toString(36);REG.list.push({id,name:'',color:'#8b1e3f',helper:false});loadProfile(id)}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
function ask(t,yes,fn){ASK=fn;modal(`<h3>${t}</h3><button class="btn" onclick="askOk()">${yes}</button><button class="btn ghost" style="margin-top:8px" onclick="closeM()">Annuleren</button>`)}
function askOk(){const f=ASK;ASK=null;closeM();if(f)f()}
function theme(){const c=S.club,r=document.documentElement;r.style.setProperty('--ac',c.color);const n=parseInt(c.color.slice(1),16),l=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255);r.style.setProperty('--on',l>150?'#111':'#fff');c.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',c.theme);document.querySelectorAll('meta[name=theme-color]').forEach(m=>m.setAttribute('content',c.color))}

/* ================= GOOGLE SHEETS ================= */
let WHO='',LOGVIA='',USER='',LPULL=false,ISDEV=false;
let AGAIN=false,TOKEN=null,TEXP=0,SYNCING=false,SI=false,ENS='',LASTPULL=0,QT=null;
try{const q=JSON.parse(sessionStorage.getItem('qg')||'null');if(q&&q.exp>Date.now()&&q.s===SCOPE){TOKEN=q.t;TEXP=q.exp}}catch(e){}
const cid=()=>(S.club.cid||GOOGLE_CLIENT_ID||'').trim();
const apiKey=()=>(S.club.akey||GOOGLE_API_KEY||'').trim();
const appId=()=>(S.club.appid||GOOGLE_APP_ID||'').trim();
const haveTok=()=>TOKEN&&Date.now()<TEXP-60000;
const autoOk=()=>S.club.gok&&S.club.gid;
const authErr=m=>{const e=new Error(m);e.auth=true;return e};
function loadGsi(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>res();s.onerror=()=>rej(new Error('Google kon niet geladen worden. Controleer je internetverbinding.'));document.head.appendChild(s)})}
function getToken(pr){return new Promise((res,rej)=>{
 if(haveTok()&&pr==null)return res(TOKEN);
 if(!cid())return rej(authErr('Geen Google Client ID ingesteld. Zie de handleiding.'));
 loadGsi().then(()=>{
  const tc=google.accounts.oauth2.initTokenClient({client_id:cid(),scope:SCOPE,
   callback:r=>{if(r.error)return rej(authErr(r.error==='access_denied'?'Toegang geweigerd in Google.':'Google-fout: '+r.error));
    TOKEN=r.access_token;TEXP=Date.now()+(+r.expires_in||3600)*1000;TEMAIL='';try{sessionStorage.setItem('qg',JSON.stringify({t:TOKEN,exp:TEXP,s:SCOPE}))}catch(e){}
    if(!S.club.gok){S.club.gok=true;save()}res(TOKEN)},
   error_callback:()=>rej(authErr('Aanmelden bij Google is niet gelukt of werd geannuleerd.'))});
  tc.requestAccessToken({prompt:pr!=null?pr:(S.club.gok?'':'consent')})}).catch(rej)})}
let TEMAIL='';
async function uinfo(tok){const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}});
 if(r.status===401||r.status===403){TOKEN=null;try{sessionStorage.removeItem('qg')}catch(e){}throw authErr('Meld je opnieuw aan bij Google.')}
 if(!r.ok)throw new Error('Je e-mailadres ophalen bij Google lukte niet.');const j=await r.json();if(!j.email)throw new Error('Google gaf geen e-mailadres door.');TEMAIL=String(j.email).trim().toLowerCase();return TEMAIL}
async function gEmail(pr){if(TEMAIL&&pr==null&&haveTok())return TEMAIL;return uinfo(await getToken(pr))}
async function api(path,opt){opt=opt||{};
 if(!haveTok()){if(!SI)throw authErr('Opnieuw verbinden nodig.');await getToken()}
 const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets'+path,{...opt,headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'}});
 if(r.status===401){TOKEN=null;try{sessionStorage.removeItem('qg')}catch(e){}throw authErr('Sessie verlopen. Tik op de status bovenaan om opnieuw te verbinden.')}
 if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}
  if((r.status===403||r.status===404)&&path.indexOf('/'+S.club.gid)===0&&!/not been used|disabled|API has/i.test(m)){const e=new Error('Geen toegang tot deze spreadsheet. Kies ze opnieuw. Lukt het niet, vraag de Quaestor om je als bewerker toe te voegen.');e.pick=true;throw e}
  throw new Error(m||('Google-fout '+r.status))}
 return r.json()}
function loadPicker(){return new Promise((res,rej)=>{if(window.google&&google.picker)return res();
 const go=()=>gapi.load('picker',{callback:res,onerror:()=>rej(new Error('De Google-keuzelijst kon niet geladen worden.'))});
 if(window.gapi&&gapi.load)return go();
 const s=document.createElement('script');s.src='https://apis.google.com/js/api.js';s.onload=go;s.onerror=()=>rej(new Error('Google kon niet geladen worden. Controleer je internetverbinding.'));document.head.appendChild(s)})}
function pickFile(tok){return new Promise(res=>{const v=new google.picker.View(google.picker.ViewId.SPREADSHEETS);
 new google.picker.PickerBuilder().setAppId(appId()).setDeveloperKey(apiKey()).setOAuthToken(tok).setLocale('nl').setTitle('Kies je spreadsheet').addView(v)
  .setCallback(d=>{const a=d[google.picker.Response.ACTION];

function parseBon(txt,itxt){
 const IL=itxt?String(itxt).split(/\r?\n/).map(s=>s.replace(/[|{}\[\]“”"]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean):null;
 const L=String(txt||'').split(/\r?\n/).map(s=>s.replace(/[|{}\[\]“”"]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const NUM=/(-?)\s?(\d{1,5})\s?[.,]\s?(\d{2})(?![\d%])/g;
 const nums=s=>{const o=[];let m;NUM.lastIndex=0;while((m=NUM.exec(s)))o.push(Math.round((+(m[2]+'.'+m[3]))*100)/100*(m[1]?-1:1));return o};
 const low=s=>s.toLowerCase();
 const BAD=/(sub\s?-?tota|btw|tva|vat|netto|excl|basis|wisselgeld|teruggave|terug\b|retour|gespaard|korting|leeggoed|goederen|food inc|aantal|items|artikelen|stuks|ticket ?nummer|kassa ?nr)/i;
 const PAYW=/(bancontact|maestro|visa|mastercard|payconiq|contant|cash|kaart|v ?pay|debit|totaal betaald|betaald)/i;
 // ---- totaal: kandidaten met score
 const cand=new Map(),add=(v,s)=>{if(!(v>0&&v<100000))return;const k=v.toFixed(2);cand.set(k,(cand.get(k)||0)+s)};
 L.forEach((l,i)=>{const ll=low(l);const n=nums(l);
  const nx=()=>{for(let j=i+1;j<Math.min(L.length,i+3);j++){const m=nums(L[j]);if(m.length)return m}return []};
  if(/te\s?betalen|a payer|à payer|to pay/i.test(ll)){(n.length?n:nx()).forEach((v,k,a)=>add(v,k===a.length-1?6:2))}
  else if(PAYW.test(ll)&&!/teruggave|wisselgeld/i.test(ll)){n.forEach((v,k,a)=>add(v,k===a.length-1?4:1))}
  else if(/\btota(a)?l\b|totale|\btotal\b/i.test(ll)&&!BAD.test(ll)){(n.length?n:nx()).forEach((v,k,a)=>add(v,k===a.length-1?4:1))}
  if(/€\s?\d/.test(l))n.forEach(v=>add(v,1))});
 const all={};L.forEach(l=>{if(!BAD.test(l))nums(l).forEach(v=>{if(v>0){const k=v.toFixed(2);all[k]=(all[k]||0)+1}})});
 for(const [k,c] of Object.entries(all))if(c>1&&cand.has(k))cand.set(k,cand.get(k)+c);
 let total=null,best=-1;for(const [k,s] of cand){const v=+k;if(s>best||(s===best&&v>total)){best=s;total=v}}
 if(total==null){let b=null;L.forEach(l=>{if(BAD.test(l))return;nums(l).forEach(v=>{if(v>0&&v<10000&&(b==null||v>b))b=v})});total=b}
 // ---- datum
 let date='';const dates=[],now=new Date(),ok=(y,mo,d)=>mo>=1&&mo<=12&&d>=1&&d<=31&&y>=2000&&new Date(y,mo-1,d)<=new Date(now.getTime()+864e5);
 for(const l of L){let m=l.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/),y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3]}else{m=l.match(/\b(\d{1,2})\s?[-\/.]\s?(\d{1,2})\s?[-\/.]\s?(\d{4}|\d{2})\b/);if(m){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000;else if(y<2000)y=2000+(y%100)}}
  if(m&&ok(y,mo,d)){const x=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;if(!dates.includes(x))dates.push(x);if(!date)date=x}}
 // ---- winkel
 const T=low(L.join(' ')),norm=s=>low(s).replace(/[^a-z0-9]/g,'');let shop='';
 const shops=[],sh=x=>{x=String(x||'').replace(/[^\wÀ-ÿ&'. -]/g,'').trim().slice(0,60);if(x&&!shops.some(y=>low(y)===low(x)))shops.push(x)};
 const TN=norm(T);for(const s of SHOPS){if(TN.includes(norm(s))&&norm(s).length>=4){shop=s;break}}if(shop)sh(shop);
 {const co=L.find(l=>/\b(bv|bvba|nv|n\.v\.|srl|sprl|vzw|comm\.?v|cvba|gmbh|ltd|sa)\b\.?\s*$/i.test(l)&&/[a-z]{3}/i.test(l));if(co)sh(co.replace(/\b(bvba|bv|nv|n\.v\.|srl|sprl|vzw|comm\.?v|cvba|gmbh|ltd|sa)\b\.?\s*$/i,''));const w=T.match(/(?:www\.)([a-z0-9-]{3,})\.(?:be|nl|com|eu|fr)/);if(w)sh(w[1].replace(/-/g,' ').replace(/^./,c=>c.toUpperCase()))}
 if(!shop){const co=L.find(l=>/\b(bv|bvba|nv|n\.v\.|srl|sprl|vzw|comm\.?v|bvba|cvba|gmbh|ltd|sa)\b\.?\s*$/i.test(l)&&/[a-z]{3}/i.test(l));if(co)shop=co.replace(/\b(bvba|bv|nv|n\.v\.|srl|sprl|vzw|comm\.?v|cvba|gmbh|ltd|sa)\b\.?\s*$/i,'').trim()}
 if(!shop){const w=T.match(/(?:www\.)([a-z0-9-]{3,})\.(?:be|nl|com|eu|fr)/);if(w)shop=w[1].replace(/-/g,' ').replace(/^./,c=>c.toUpperCase())}
 if(!shop){const SKIP=/(algemene|voorwaarden|ticket|pro ?forma|tussenrekening|kasticket|kassa|welkom|bienvenue|datum|tel\.?|btw|tva|factuur|rekening|bedankt|merci|quality|instituut|prijzen|openingsuren)/i;
  for(const l of L.slice(0,8)){const a=(l.match(/[A-Za-zÀ-ÿ]/g)||[]).length;if(a>=3&&a/l.length>.6&&!SKIP.test(l)){shop=l;break}}}
 shop=shop.replace(/[^\wÀ-ÿ&'. -]/g,'').trim().slice(0,60);
 // ---- artikelen
 const items=[];
 (IL||L).forEach(l=>{if(/te\s?betalen|tota(a)?l|btw|netto|wisselgeld|teruggave|ticketnummer|openingsuren|ter info|\btel\b|\d{1,2}[.:]\d{2}\s?-\s?\d{1,2}[.:]\d{2}|\d{3}\s?\d{2}\s?\d{2}\s?\d{2}/i.test(l)||PAYW.test(l))return;
  const n=nums(l);if(!n.length)return;const v=n[n.length-1];if(!(Math.abs(v)<10000))return;
  let name=l.replace(/^[^A-Za-zÀ-ÿ]*/,'').replace(/^[A-Za-z]{1,2}\b\s+(?=[A-Z0-9]{3,6}\s*[\/|])/,'').replace(/^[A-Z0-9]{3,6}\s*[\/|]\s*/,'').replace(/^[A-Za-z]{1,2}\b\s+(?=\d)/,'').replace(/^\d+\s*[\/|]?\s*/,'');
  const cut=name.search(/[\s~+]-?\d{1,5}\s?[.,]\s?\d{2}(?![\d%])/);if(cut>0)name=name.slice(0,cut);
  name=name.replace(/^\d+\s?[xX*]\s?/,'').replace(/[^\wÀ-ÿ%&,.'\/ -]/g,'').replace(/\s+/g,' ').trim();
  const letters=(name.match(/[A-Za-zÀ-ÿ]/g)||[]).length;if(letters<3||letters/name.length<.45||!/[A-Za-zÀ-ÿ]{4,}/.test(name))return;
  if(total!=null&&Math.abs(v)===total&&/totaal|total/i.test(l))return;items.push({n:name.slice(0,60),v})});
 const amounts=[...cand.entries()].sort((a,b)=>b[1]-a[1]||b[0]-a[0]).map(x=>+x[0]);Object.keys(all).map(Number).sort((a,b)=>b-a).forEach(v=>{if(!amounts.includes(v))amounts.push(v)});
 if(shop)sh(shop);if(shop&&shops[0]!==shop){shops.splice(shops.indexOf(shop),1);shops.unshift(shop)}
 return{shop,date,total,items,amounts:amounts.slice(0,8),dates:dates.slice(0,4),shops:shops.slice(0,4)}}

 return `<button class="back" onclick="SUBM='';render();scrollTo(0,0)">← Meer</button><h2 style="margin:0 0 4px">${t}</h2>${['club','leden','rmd'].includes(SUBM)?'<p class="mu" style="margin:0 0 10px">Wijzigingen worden meteen bewaard.</p>':'<div style="height:8px"></div>'}<div onchange="autoSave(event)">${body()}</div>`}
let ACCL=null,ACCE='';
function accOpen(){tab='acc';ACCL=null;ACCE='';render();scrollTo(0,0);accLoad()}
async function accLoad(){if(!S.club.gid||!S.club.gok){ACCE='Verbind eerst met Google (Meer → Google Sheets). De accounts worden in de spreadsheet bijgehouden.';return tab==='acc'&&render()}
 for(let i=0;SYNCING&&i<100;i++)await new Promise(r=>setTimeout(r,150));
 try{SI=true;await syncSettings();try{await pushUsers();await pullUsers()}catch(e){if(e.auth)throw e}const l=await accList(S.club.gid),A=S.club.acc||{},by=new Map(),junk=[];
  l.forEach(o=>{if((A[o.id]||{}).s==='weg'){junk.push(o.mid);return}const p=by.get(o.id);if(!p){by.set(o.id,o);return}if((+o.l||0)>(+p.l||0)){junk.push(p.mid);by.set(o.id,o)}else junk.push(o.mid)});
  if(junk.length)try{await accDel(junk)}catch(e){}
  ACCL=[...by.values()];ACCE=''}catch(e){ACCE=e.message||'Laden is niet gelukt'}finally{SI=false}
 if(tab==='acc')render()}
const dt=x=>x?new Date(+x).toLocaleDateString('nl-BE',{day:'numeric',month:'short',year:'numeric'}):'?';
function vAcc(){const c=S.club,A=c.acc||{},dst=o=>(A[o.id]||{}).s||'';
 let h=`<button class="back" onclick="tab='inst';render()">← Accounts en helpers</button>`;
 if(ACCE)return h+`<div class="card"><p class="err">${esc(ACCE)}</p><button class="btn" onclick="accOpen()">Opnieuw proberen</button></div>`;
 if(!ACCL)return h+`<div class="card"><p class="mu">Accounts laden…</p></div>`;
 const U=actU(),names=new Set(U.map(u=>uk(u.u))),devs=ACCL.filter(o=>dst(o)!=='uit');
 const dev=(o,nb)=>{const mine=o.id===c.dev||nb===true,tg=[];if(mine)tg.push('<span class="tag">Dit toestel</span>');
  if(Date.now()-(+o.l||0)>60*864e5)tg.push('<span class="tag warn">Meer dan 2 maanden niet gebruikt</span>');
  if((+o.v||0)<+APP_VERSION)tg.push(`<span class="tag">Oude versie ${esc(o.v||'?')}</span>`);
  return `<div class="accd"><div>${esc(o.d||'Onbekend toestel')} ${tg.join('')}</div><div class="mu">Laatst actief ${dt(o.l)}</div>${mine?'':`<div class="accb"><button class="btn ghost" onclick="accRm('${esc(o.id)}')">Toestel verwijderen</button></div>`}</div>`};
 const usr=u=>{const mine=u.id===USER,ds=devs.filter(o=>uk(o.n)===uk(u.u)).sort((a,b)=>(+b.l||0)-(+a.l||0)),tg=[],b=[];
  if(mine)tg.push('<span class="tag">Jij</span>');if(ds.length>1)tg.push(`<span class="tag">${ds.length} toestellen</span>`);if(u.dirty)tg.push('<span class="tag">Nog niet verstuurd</span>');
  const dv=isDev(u.e)||u.r==='d';if(dv)tg.push('<span class="tag">Kan niet buitengesloten worden</span>');
  if(!mine&&!dv){if(u.st==='uit')b.push(['','Toegang teruggeven']);else{['q','h','p'].filter(x=>x!==u.r).forEach(x=>b.push([x,x==='q'?'Quaestor maken':x==='h'?'Helper maken':'Alleen bonnetjes (praesidium)']));b.push(['uit','Toegang intrekken'])}if(!u.e&&u.code)b.push(['pw','Nieuw wachtwoord']);b.push(['weg','Account verwijderen'])}
  return `<div class="acc"><b>${esc(u.u)}</b> ${tg.join('')}<div class="mu">${u.e?esc(u.e):'Nog niet gekoppeld aan Google (oud wachtwoord)'} · account sinds ${dt(u.ct)}${ds.length?'':' · nog op geen enkel toestel actief geweest'}</div>${b.length?`<div class="accb">${b.map(x=>`<button class="btn ghost" onclick="uAct('${esc(u.id)}','${x[0]}')">${x[1]}</button>`).join('')}</div>`:''}${ds.map(o=>dev(o,dv)).join('')}</div>`};
 const sec=(t,l,e)=>`<div class="card"><h2>${t} (${l.length})</h2>${l.length?l.slice().sort((a,b)=>a.u.localeCompare(b.u)).map(usr).join(''):`<p class="mu">${e}</p>`}</div>`;
 const loose=devs.filter(o=>!names.has(uk(o.n)));
 const ER=u=>isDev(u.e)||u.r==='d'?'d':u.r,on=U.filter(u=>u.st!=='uit');
 return h+(on.some(u=>ER(u)==='d')?sec('Developer',on.filter(u=>ER(u)==='d'),''):'')+sec('Quaestors',on.filter(u=>ER(u)==='q'),'Geen.')+sec('Helpers',on.filter(u=>ER(u)==='h'),'Geen helpers. Helpers kunnen boekingen doen en bonnetjes indienen.')+sec('Praesidium',on.filter(u=>ER(u)==='p'),'Niemand. Praesidiumleden kunnen alleen bonnetjes indienen.')
  +(U.some(u=>u.st==='uit')?sec('Toegang ingetrokken',U.filter(u=>u.st==='uit'),''):'')
  +(loose.length?`<div class="card"><h2>Toestellen zonder account (${loose.length})</h2><p class="mu">Toestellen die nog met een pincode werken of waarvan de naam bij geen account hoort. Ze moeten bij het volgende aanmelden een account maken.</p>${loose.map(o=>`<div class="acc"><b>${esc(o.n||'(geen naam)')}</b>${dev(o)}</div>`).join('')}</div>`:'')
  +`<div class="card"><h2>Goed om te weten</h2><p class="mu"><b>Quaestor</b> mag alles. <b>Helper</b> mag boeken en bonnetjes indienen. <b>Praesidium</b> mag alleen bonnetjes indienen. Nieuwe accounts beginnen als praesidium; jij geeft meer rechten. Een wijziging werkt binnen een minuut.</p><p class="mu">Wie geen toegang meer mag hebben, haal je ook weg bij Delen in Google Drive.</p><a class="btn ghost" href="https://docs.google.com/spreadsheets/d/${esc(c.gid)}/edit" target="_blank" rel="noopener">Spreadsheet openen om te delen of weg te halen</a><button class="btn ghost" style="margin-top:8px" onclick="accOpen()">Lijst vernieuwen</button></div>`}
function uAct(id,a){const u=S.users.find(x=>x.id===id);if(!u||id===USER||role!=='q'||isDev(u.e)||u.r==='d')return;const n=esc(u.u);
 if(a==='pw')return modal(`<h3>Nieuw wachtwoord voor ${n}</h3><p class="mu">Geef het daarna zelf aan ${n}. Die kan het later wijzigen bij Je account.</p><label>Nieuw wachtwoord<input id="rpw" type="password" autocomplete="new-password"></label><label>Herhalen<input id="rpw2" type="password" autocomplete="new-password"></label><button class="btn" onclick="uPwOk('${esc(id)}')">Opslaan</button>`);
 const q=a==='q'?`${n} promoveren tot Quaestor? ${n} kan dan alles wat jij kan: leden, prijzen en instellingen beheren, bonnetjes inboeken en accounts beheren.`:a==='h'?`${n} helper maken? ${n} kan dan boekingen doen en bonnetjes indienen.`:a==='p'?`${n} alleen bonnetjes laten indienen? ${n} kan dan geen boekingen meer doen.`:a==='uit'?`Toegang van ${n} intrekken? ${n} wordt afgemeld zodra het toestel synchroniseert en kan niet meer aanmelden. Boekingen blijven staan.`:a==='weg'?`Account van ${n} verwijderen? ${n} wordt afgemeld en de naam komt vrij. Boekingen blijven staan.`:`Toegang teruggeven aan ${n}?`;
 ask(q,a==='q'?'Promoveren':a==='h'?'Helper maken':a==='p'?'Alleen bonnetjes':a==='uit'?'Intrekken':a==='weg'?'Verwijderen':'Teruggeven',()=>uSet(id,['q','h','p'].includes(a)?{r:a}:{st:a}))}
function uSet(id,o){const u=S.users.find(x=>x.id===id);if(!u)return;Object.assign(u,o,{mt:Date.now(),dirty:true});save();render();queueSync();
 toast(o.r==='q'?'Gepromoveerd tot Quaestor':o.r==='h'?'Nu helper':o.r==='p'?'Kan nu alleen bonnetjes indienen':o.st==='uit'?'Toegang ingetrokken':o.st==='weg'?'Account verwijderd':o.code?'Nieuw wachtwoord ingesteld':'Toegang teruggegeven')}
async function uPwOk(id){const v=validP($('#rpw').value,$('#rpw2').value);if(v)return toast(v);const salt=rnd(),code=await pwHash($('#rpw').value,salt);closeM();uSet(id,{salt,code})}
const accName=id=>{const o=(ACCL||[]).find(x=>x.id===id);return o?esc((o.n||'dit toestel')+' ('+(o.d||'onbekend toestel')+')'):'dit toestel'};
function accSet(id,s){if(id===S.club.dev)return;const n=accName(id);
 const q=s==='uit'?`Toegang van ${n} intrekken? Dat toestel kan niets meer boeken zodra het synchroniseert. Boekingen die het al deed, blijven staan.`:s==='h'?`${n} alleen helperrechten geven? Op dat toestel werkt de Quaestorpincode dan niet meer.`:s==='q'?`${n} Quaestor maken? Die persoon kan dan alles wat jij kan: leden, prijzen en instellingen beheren, bonnetjes inboeken en accounts beheren. Aanmelden gebeurt met de eigen pincode van dat toestel.`:`Toegang teruggeven aan ${n}?`;
 ask(q,s==='uit'?'Intrekken':s==='h'?'Alleen helper':s==='q'?'Quaestor maken':'Teruggeven',()=>accApply(id,s))}
function accApply(id,s){const c=S.club;c.acc=Object.assign({},c.acc,{[id]:{s,t:Date.now()}});c.setDirty=true;save();render();queueSync();
 toast(s==='uit'?'Toegang ingetrokken':s==='h'?'Alleen nog helperrechten':s==='q'?'Quaestorrechten gegeven':s==='weg'?'Toestel verwijderd':'Toegang teruggegeven')}
function accRm(id){if(id===S.club.dev)return;const n=accName(id);
 ask(`${n} verwijderen? Dat toestel wist deze club zodra het synchroniseert. Boekingen die het nog niet verstuurd had, worden eerst verstuurd. Wil de persoon later terugkomen, dan nodig je hem opnieuw uit.`,'Verwijderen',async()=>{
  const o=(ACCL||[]).find(x=>x.id===id);ACCL=(ACCL||[]).filter(x=>x.id!==id);accApply(id,'weg');if(o&&o.mid!=null)try{SI=true;await accDel([o.mid])}catch(e){}finally{SI=false}})}
const AUTO=new Set(['in','ic','it2','iw','ia','iq','ih','ime','ich','ics','ist','ict','icid','iak','iap']);
function autoSave(e){const t=e&&e.target;if(t&&AUTO.has(t.id))saveSet(true)}
function prevColor(v){if(!/^#[0-9a-f]{6}$/i.test(v))return;const o=S.club.color;S.club.color=v;theme();S.club.color=o}
function saveSet(quiet){const q=$('#iq')?$('#iq').value.trim():'',h=$('#ih')?$('#ih').value.trim():'',c0=S.club;
 if($('#iq')&&((q&&q.length<4)||(h&&h.length<4)||(!q&&!c0.pinQh)||(!h&&!c0.pinHh)||(q&&q===h)))return toast('Pincodes: minstens 4 cijfers en niet gelijk');
 if($('#ich')){const list=id=>[...new Set($(id).value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];
  const ch=list('#ich'),cs=list('#ics');if(!ch.length)return toast('Voeg minstens één hoofdcategorie toe');S.cats={h:ch,s:cs}}
 if($('#ime')){const v=$('#ime').value.trim();if(v.length<4)return toast('Je eigen pincode heeft minstens 4 cijfers');S.club.pinMe=v}
 Object.assign(S.club,{name:($('#in')&&$('#in').value.trim())||S.club.name,color:$('#ic')?$('#ic').value:S.club.color,theme:$('#it2')?$('#it2').value:S.club.theme,pinQ:q||S.club.pinQ,pinH:h||S.club.pinH,setDirty:true});
 if($('#ist')){const l=$('#ist').value.split(/\r?\n/).map(cleanSt).filter(Boolean);if(!l.length)return toast('Voeg minstens één status toe');const old=JSON.stringify(S.statuses);setStatuses(l);if(JSON.stringify(S.statuses)!==old){S.club.setDirty=true;if(S.prices.length)S.pricesDirty=true;S.members.forEach(m=>m.dirty=true)}}
 const iw=$('#iw')?($('#iw').value||'').trim().slice(0,40):'';if(iw.length>=2){S.club.names.q=iw;if(role==='q')WHO=iw}if($('#ia'))S.club.askName=$('#ia').value==='1';
 readG();theme();toast('Opgeslagen');if(quiet){const h=document.querySelector('header h1');if(h&&h.firstChild)h.firstChild.textContent=S.club.name+' ▾ ';save();return}render()}
function logo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.club.logo=c.toDataURL('image/png');save();render()};im.src=r.result};r.readAsDataURL(f)}
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return ['id;datum;lid;omschrijving;hoofdcategorie;subcategorie;betaalwijze;bedrag;status;ingevoerd door'].concat(S.tx.map(t=>[t.id,t.date,t.name,t.desc,t.h,t.s,M[t.method],String(t.v).replace('.',','),t.storno?'storno':t.void?'gestorneerd':'ok',t.who||(t.by==='q'?'Quaestor':'Helper')].map(q).join(';'))).join('\n')}
function showT(t,x){modal(`<h3>${t}</h3><textarea id="tx" readonly>${esc(x)}</textarea><button class="btn" style="margin-top:10px" onclick="cp()">Kopiëren</button>`)}
